name: CI

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Android, JVM, JS, WasmJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      # Without an explicit `packages:` override, the action's own default list includes the
      # legacy `tools` meta-package, which Google has since discontinued and removed from the SDK
      # repository — `sdkmanager tools` exits 1 ("Failed to find package 'tools'"), failing this
      # step before ./gradlew ever runs. Only platform-tools is actually needed here; AGP resolves
      # everything else (build-tools, the target platform) itself during the Gradle build.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # NOT the blanket `build` task: that also builds :shared's and :sync-core's own iOS
      # target directly, which needs the Apple linker and fails outright on Linux. Building each
      # consumer module instead (androidApp/desktopApp/webApp) only pulls in the shared/sync-core
      # compilation for the target that consumer actually depends on — Gradle's variant-aware
      # resolution means that's Android/JVM/JS/WasmJS here, never iOS.
      - run: ./gradlew :androidApp:build :desktopApp:build :webApp:build :shared:jvmTest :sync-core:jvmTest

  package:
    name: Build ${{ matrix.artifact }} installer
    needs: build
    # Only on an actual release tag — a workflow_dispatch run is for iterating on CI itself, not
    # for cutting installers, and jpackage can't cross-compile a target OS's installer from a
    # different host, so this always needs one runner per target OS.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: :desktopApp:packageReleaseDeb
            artifact: deb
            glob: desktopApp/build/compose/binaries/main-release/deb/*.deb
          - os: windows-latest
            task: :desktopApp:packageReleaseMsi
            artifact: msi
            glob: desktopApp/build/compose/binaries/main-release/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # jpackage's MSI target shells out to WiX Toolset (candle.exe/light.exe) to build the
      # installer; windows-latest doesn't have it preinstalled. No-op on the ubuntu leg of the
      # matrix (dpkg-deb, what the Deb target actually shells out to, ships on every Ubuntu image).
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y

      - run: ./gradlew ${{ matrix.task }}

      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Workflow-level permissions stay read-only; only this job, the one that actually needs to
    # create a Release and upload assets to it, gets write access.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pipeline-*
          merge-multiple: true

      # softprops/action-gh-release creates the Release from the pushed tag (or updates it, if one
      # already exists for this tag) and attaches whatever files are handed to it — no separate
      # "create release" step needed.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.msi
          generate_release_notes: true

  ios:
    name: Build iOS app
    runs-on: macos-latest
    # macOS runner minutes cost ~10x Linux on a private repo's included-minutes pool, so this
    # doesn't even run on a release tag automatically — only on an explicit manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # iosApp.xcodeproj has a Run Script build phase that calls
      # `./gradlew :shared:embedAndSignAppleFrameworkForXcode` itself (see
      # iosApp/iosApp.xcodeproj/project.pbxproj) — the same thing Xcode does on a local build —
      # so building the scheme is enough; no separate Gradle step to assemble the framework first.
      - name: Build iosApp
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'generic/platform=iOS Simulator' \
            build
